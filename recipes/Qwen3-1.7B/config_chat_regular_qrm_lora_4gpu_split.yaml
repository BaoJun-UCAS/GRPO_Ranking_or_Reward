# Four-GPU split recipe: vLLM + external QRM + two policy-training GPUs.
# Documented variables are safely resolved by train_scripts/run_helpers.py.

# Model arguments
model_name_or_path: ${MODEL_NAME}
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

# Data arguments
dataset_name: ${DATASET_NAME}
dataset_prompt_column: prompt
dataset_train_split: train
dataset_test_split: val
system_prompt: ""

# GRPO and generation
bf16: true
use_vllm: true
vllm_mode: server
use_cpu_object_collectives: true
trim_unused_padding: true
profile_stage_timings: true
vllm_server_base_url: http://127.0.0.1:${VLLM_HTTP_PORT}
vllm_group_port: ${VLLM_GROUP_PORT}
vllm_server_timeout: 600
advantage: studentization
token_broadcast: uniform
loss_type: bnpo
beta: 0.04
num_iterations: 1
epsilon: 0.2
mask_truncated_completions: false
num_generations: ${NUM_GENERATIONS}
temperature: 1.0
max_prompt_length: ${MAX_PROMPT_LENGTH}
max_completion_length: ${MAX_COMPLETION_LENGTH}
generation_batch_size: ${GENERATION_BATCH_SIZE}
per_device_train_batch_size: ${PER_DEVICE_TRAIN_BATCH_SIZE}
gradient_accumulation_steps: ${GRADIENT_ACCUMULATION_STEPS}
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true

# Optimizer and schedule
learning_rate: 1.0e-06
lr_scheduler_type: constant_with_warmup
warmup_steps: 10
max_steps: ${MAX_STEPS}
num_train_epochs: 10

# Reward model
reward_funcs:
- qrm_server
reward_server_url: http://127.0.0.1:${QRM_HTTP_PORT}
reward_server_timeout: ${QRM_REQUEST_TIMEOUT}
reward_weights:
- 1.0

# Logging and reproducibility
seed: 42
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
log_completions: false
report_to:
- wandb
run_name: ${RUN_NAME}
output_dir: ${OUTPUT_DIR}
overwrite_output_dir: false
push_to_hub: false

# Local result storage. Keep only three resumable checkpoints.
save_strategy: steps
save_steps: 100
save_total_limit: 3
save_reward_data: true
reward_data_save_path: ${OUTPUT_DIR}/reward_data

# Evaluation is performed after training with the dedicated evaluation scripts.
do_eval: false
eval_strategy: "no"
eval_on_start: false
per_device_eval_batch_size: 2
