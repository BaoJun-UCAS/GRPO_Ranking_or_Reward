accelerate_config: recipes/accelerate_configs/zero2_2gpus.yaml
# Change these data fields before preparing a NEW experiment directory.
data:
  source: /data/baojun/datasets/ultrachat_200k_grpo_seed42
  train_split: train
  eval_source: null
  eval_split: test
  prompt_column: prompt
  eval_prompt_column: null
