model_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
qrm_model: friendshipkim/QRM-Llama3.1-8B-v2
qrm_revision: 23c6db70a35875248f45b3cfbe6d237ba8ac3e6d
