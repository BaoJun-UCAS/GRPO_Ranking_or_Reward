  qrm_gpu: "5"
  train_gpus: "6,7"
  vllm_http_port: 8000
  qrm_http_port: 8001
  training_port: 29501
  weight_sync_port: 51216
  max_model_len: 6144
  qrm_max_length: 6144
  qrm_max_batch_tokens: 6144
  reward_batch_size: 4
  vllm_max_num_seqs: 256
  vllm_gpu_memory_utilization: 0.82
evaluation:
  num_prompts: 200
  seed: 31415
  gpu: "4"
