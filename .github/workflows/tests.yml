name: lightweight-ci

on:
  push:
    branches:
      - main
      - v*-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only deployment test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test deployment, lifecycle and server protocol without GPUs
        run: PYTHONPATH=src python -m pytest -q tests/
      - name: Check shell syntax
        run: |
          for script in train_scripts/*.sh evaluate/*.sh; do bash -n "$script"; done
      - name: Check whitespace errors
        run: git show --format= --check HEAD
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
