name: lightweight-ci

on:
  push:
    branches:
      - main
      - v*-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: Run dependency-free tests
        run: python -m pytest -q tests/test_project_structure.py
      - name: Check shell syntax
        run: bash -n train_scripts/qwen3_1.7_grpo_chat.sh evaluate/run_grpo_chat_deepseek.sh
      - name: Check whitespace errors
        run: git diff --check HEAD^
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'

